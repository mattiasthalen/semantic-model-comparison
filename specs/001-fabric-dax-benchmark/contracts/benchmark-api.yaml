openapi: 3.0.3
info:
  title: Fabric DAX Benchmarking External APIs
  version: 1.0.0
  description: Outbound REST calls used by the benchmark notebook.
servers:
  - url: https://api.powerbi.com
    description: Power BI REST API (execute DAX queries)
  - url: https://api.fabric.microsoft.com
    description: Fabric REST API (Eventhouse lookup)
  - url: https://{queryServiceUri}
    description: KQL query service for Eventhouse
    variables:
      queryServiceUri:
        default: example.kusto.fabric.microsoft.com

paths:
  /v1.0/myorg/groups/{groupId}/datasets/{datasetId}/executeQueries:
    post:
      summary: Execute a DAX query against a dataset in a workspace
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DaxExecuteRequest'
      responses:
        '200':
          description: DAX query executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaxExecuteResponse'

  /v1/workspaces/{workspaceId}/eventhouses/{eventhouseId}:
    get:
      summary: Resolve Eventhouse queryServiceUri
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: eventhouseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Eventhouse details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eventhouse'

  /v1/rest/query:
    post:
      summary: Execute a KQL query against the Eventhouse query service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KqlQueryRequest'
      responses:
        '200':
          description: KQL query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KqlQueryResponse'

components:
  schemas:
    DaxExecuteRequest:
      type: object
      required: [queries]
      properties:
        queries:
          type: array
          items:
            type: object
            required: [query]
            properties:
              query:
                type: string
        serializerSettings:
          type: object
          properties:
            includeNulls:
              type: boolean

    DaxExecuteResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              tables:
                type: array
                items:
                  type: object
                  properties:
                    rows:
                      type: array
                      items:
                        type: object

    Eventhouse:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        properties:
          type: object
          properties:
            queryServiceUri:
              type: string

    KqlQueryRequest:
      type: object
      required: [db, csl]
      properties:
        db:
          type: string
        csl:
          type: string

    KqlQueryResponse:
      type: object
      additionalProperties: true
